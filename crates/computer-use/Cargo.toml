[package]
name = "maka-computer-use"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cua-driver-contract.workspace = true
cua-driver-sdk.workspace = true
maka-plugins.workspace = true
maka-runtime.workspace = true
maka-tool-catalog.workspace = true
maka-js-runtime.workspace = true
serde.workspace = true
schemars.workspace = true
uuid.workspace = true
libc.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true
base64 = "0.22.1"
futures-util.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
platform-macos = { git = "https://github.com/trycua/cua", rev = "5b3d48dfda23bde15ae1f2c150940defbdc64c21" }
cua-driver-core = { git = "https://github.com/trycua/cua", rev = "5b3d48dfda23bde15ae1f2c150940defbdc64c21" }
core-foundation = "0.10.1"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
